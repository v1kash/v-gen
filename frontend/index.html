<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Animated Chatbot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.4rem; }
        .layout { display: flex; gap: 16px; align-items: flex-start; }
        #history { width: 220px; flex-shrink: 0; border-right: 1px solid #e5e7eb; padding-right: 16px; max-height: 90vh; overflow-y: auto; }
        #history h2 { font-size: 1rem; margin-top: 0; }
        #history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item { border: 1px solid #e5e7eb; border-radius: 8px; padding: 4px; background: #fff; cursor: pointer; overflow: hidden; }
        .history-item:hover { border-color: #2563eb; }
        .history-thumb { width: 100%; height: 110px; object-fit: cover; display: block; background: #f3f4f6; border-radius: 6px; }
        .history-video { width: 100%; height: 110px; object-fit: cover; background: #000; display: block; border-radius: 6px; }
        .history-empty { color: #6b7280; font-size: 14px; }
        #content { flex: 1; min-width: 0; }
        .mode-toggle { display: inline-flex; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
        .mode-toggle button { padding: 8px 18px; background: #f7f7f7; border: none; cursor: pointer; font-size: 14px; }
        .mode-toggle button.active { background: #2563eb; color: #fff; }
        #prompt { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; }
        #generate-btn { padding: 10px 24px; font-size: 16px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        #generate-btn:disabled { background: #93c5fd; cursor: not-allowed; }
        #error { color: #dc2626; min-height: 20px; margin: 8px 0; }
        #loading { text-align: center; padding: 30px 10px; }
        .hidden { display: none !important; }
        .spinner { border: 5px solid #dbeafe; border-top: 5px solid #2563eb; border-radius: 50%; width: 46px; height: 46px; animation: spin 0.9s linear infinite; margin: 0 auto 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress { width: 320px; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin: 14px auto 6px; }
        .progress-bar { height: 100%; width: 0%; background: #2563eb; transition: width 0.2s ease; }
        #progress-text { font-size: 13px; color: #6b7280; }
        #generated-image, #animation { max-width: 100%; border-radius: 8px; display: none; margin-top: 16px; background: #fff; }
        #animation { background: #000; }
        #zoom-controls { display: none; gap: 8px; margin-top: 8px; }
        #zoom-controls button { padding: 6px 14px; font-size: 16px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; }
        #zoom-controls button:hover { background: #e5e7eb; }
        @media (max-width: 700px) { .layout { flex-direction: column; } #history { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid #e5e7eb; padding-right: 0; padding-bottom: 12px; } }
    </style>
</head>
<body>
    <div class="layout">
        <aside id="history">
            <h2>History</h2>
            <div id="history-list"></div>
        </aside>
        <section id="content">
            <h1>Enter Animation Prompt:</h1>

            <div class="mode-toggle">
                <button id="mode-image" class="active" onclick="setMode('image')">🎨 Image</button>
                <button id="mode-video" onclick="setMode('video')">🎬 Video</button>
            </div>

            <input type="text" id="prompt" placeholder="e.g. A circle flying into a star">

            <button id="generate-btn" onclick="generate()">Generate</button>

            <p id="error"></p>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p id="loading-text">Generating...</p>
                <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
                <p id="progress-text">0%</p>
            </div>

            <div id="zoom-controls">
                <button id="zoom-in" onclick="zoomIn()">+</button>
                <button id="zoom-out" onclick="zoomOut()">&minus;</button>
                <button id="zoom-reset" onclick="resetZoom()">Reset</button>
            </div>

            <img id="generated-image" alt="Generated image">
            <video id="animation" controls></video>
        </section>
    </div>

    <script src="/chatbot.js"></script>
</body>
</html>
