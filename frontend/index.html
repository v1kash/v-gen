<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Animated Chatbot</title>
    <style>
        body { min-height: 100dvh; box-sizing: border-box; overflow-x: hidden; overflow-y: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.4rem; }
        .layout { display: flex; min-height: calc(100dvh - 40px); gap: 16px; align-items: stretch; }
        #history { width: 220px; max-height: calc(100dvh - 40px); box-sizing: border-box; flex-shrink: 0; border-right: 1px solid #e5e7eb; padding-right: 16px; overflow-y: auto; }
        .history-heading { display: flex; align-items: center; justify-content: space-between; }
        #history h2 { font-size: 1rem; margin-top: 0; }
        #history-toggle, #history-close, #history-backdrop { display: none; }
        .history-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin: 4px 0 12px; padding: 3px; border: 1px solid #d1d5db; border-radius: 6px; background: #f3f4f6; }
        .history-tab { padding: 6px 8px; border: 0; border-radius: 4px; background: transparent; color: #4b5563; font-size: 13px; cursor: pointer; }
        .history-tab.active { background: #fff; color: #111827; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
        #history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-entry { position: relative; display: flex; }
        .history-item { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 4px; background: #fff; cursor: pointer; overflow: hidden; text-align: left; }
        .history-item:hover { border-color: #2563eb; }
        .history-prompt { display: -webkit-box; overflow: hidden; color: #374151; font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; }
        .history-delete { position: absolute; right: 10px; bottom: 10px; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 6px; background: rgba(17, 24, 39, 0.78); color: #fff; font-size: 18px; cursor: pointer; }
        .history-delete:hover { background: #b91c1c; }
        .history-delete:disabled { opacity: 0.55; cursor: wait; }
        .history-thumb { width: 100%; height: 110px; object-fit: cover; display: block; background: #f3f4f6; border-radius: 6px; }
        .history-video { width: 100%; height: 110px; object-fit: cover; background: #000; display: block; border-radius: 6px; }
        .history-empty { color: #6b7280; font-size: 14px; }
        #content { flex: 1; min-width: 0; min-height: calc(100dvh - 40px); }
        .mode-toggle { display: inline-flex; align-self: flex-start; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
        .mode-toggle button { padding: 8px 18px; background: #f7f7f7; border: none; cursor: pointer; font-size: 14px; }
        .mode-toggle button.active { background: #2563eb; color: #fff; }
        #video-controls { display: none; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin: 0 0 8px; }
        .video-mode-toggle { display: inline-flex; border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
        .video-mode-toggle button { padding: 7px 10px; border: 0; background: #f7f7f7; color: #374151; font-size: 13px; cursor: pointer; }
        .video-mode-toggle button.active { background: #2563eb; color: #fff; }
        .ai-video-image-source { display: none; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
        #ai-video-image, #ai-video-upload { max-width: 260px; min-height: 34px; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #111827; }
        .prompt-row { display: flex; align-items: stretch; gap: 8px; }
        #prompt { flex: 1; min-width: 0; width: 100%; padding: 10px; font-size: 16px; margin: 0; box-sizing: border-box; }
        #generate-btn { flex: 0 0 auto; padding: 10px 20px; font-size: 16px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; }
        #generate-btn:disabled { background: #93c5fd; cursor: not-allowed; }
        #image-settings { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin: 8px 0 4px; }
        .image-setting { display: flex; flex-direction: column; gap: 4px; color: #374151; font-size: 13px; }
        .setting-value { color: #6b7280; font-variant-numeric: tabular-nums; }
        #style-preset { min-height: 34px; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #111827; }
        .range-setting input { width: 170px; margin: 3px 0 0; accent-color: #2563eb; }
        #error { color: #dc2626; min-height: 0; margin: 4px 0; }
        #loading { text-align: center; padding: 30px 10px; }
        .hidden { display: none !important; }
        .spinner { border: 5px solid #dbeafe; border-top: 5px solid #2563eb; border-radius: 50%; width: 46px; height: 46px; animation: spin 0.9s linear infinite; margin: 0 auto 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress { width: 320px; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin: 14px auto 6px; }
        .progress-bar { height: 100%; width: 0%; background: #2563eb; transition: width 0.2s ease; }
        #progress-text { font-size: 13px; color: #6b7280; }
        #viewer-shell { display: none; width: 100%; min-width: 0; }
        #viewer-controls { display: none; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
        #viewer-prompt { margin: 8px 0 0; padding: 8px 10px; border-left: 3px solid #0f766e; border-radius: 0 4px 4px 0; background: #f3f4f6; color: #374151; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; max-height: 5.8em; overflow-y: auto; }
        #viewer-shell:fullscreen #viewer-prompt { background: #1f2937; color: #f9fafb; border-left-color: #5eead4; }
        #media-stage { display: none; width: 100%; height: clamp(120px, calc(100dvh - 300px), 720px); margin-top: 8px; overflow: hidden; overscroll-behavior: contain; border-radius: 8px; background: #111827; }
        #image-canvas { display: none; place-items: center; min-width: 100%; min-height: 100%; box-sizing: border-box; }
        #generated-image { display: none; max-width: none; max-height: none; margin: 0; object-fit: contain; }
        #animation { display: none; width: 100%; height: 100%; margin: 0; border-radius: 0; background: #000; object-fit: contain; }
        #zoom-controls { display: none; align-items: center; gap: 8px; margin-top: 8px; }
        #zoom-controls button { min-width: 36px; height: 36px; padding: 6px 12px; font-size: 16px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; }
        #zoom-controls button:hover:not(:disabled) { background: #e5e7eb; }
        #zoom-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #zoom-level { min-width: 52px; color: #4b5563; font-size: 14px; text-align: center; }
        #fullscreen-toggle { min-width: 40px; height: 36px; border: 1px solid #d1d5db; border-radius: 6px; background: #f3f4f6; color: #111827; font-size: 20px; cursor: pointer; }
        #fullscreen-toggle:hover { background: #e5e7eb; }
        #viewer-shell:fullscreen { display: flex; flex-direction: column; width: 100vw; height: 100vh; box-sizing: border-box; padding: 16px; background: #111827; }
        #viewer-shell:fullscreen #media-stage { flex: 1; width: 100%; height: auto; min-height: 0; margin-top: 12px; }
        #viewer-shell:fullscreen #zoom-controls button, #viewer-shell:fullscreen #fullscreen-toggle { background: #fff; }
        #viewer-shell:fullscreen #zoom-level { color: #f9fafb; }
        @media (max-width: 700px) {
            .layout { flex-direction: column; align-items: stretch; }
            #media-stage { height: clamp(120px, calc(100dvh - 410px), 720px); }
            .prompt-row { flex-direction: column; }
            #generate-btn { align-self: flex-start; }
            #image-settings { align-items: flex-start; gap: 10px 14px; }
            #video-controls, .ai-video-image-source { align-items: flex-start; }
            #history-toggle { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin: 0 0 12px; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #111827; font-size: 14px; cursor: pointer; }
            #history { position: fixed; z-index: 31; top: 0; left: 0; width: min(320px, 85vw); height: 100dvh; max-height: none; box-sizing: border-box; padding: 20px; border: 0; background: #fff; box-shadow: 8px 0 28px rgba(0, 0, 0, 0.18); transform: translateX(-105%); visibility: hidden; transition: transform 180ms ease, visibility 180ms; }
            body.history-open #history { transform: translateX(0); visibility: visible; }
            #history-close { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #111827; font-size: 24px; cursor: pointer; }
            #history-backdrop { position: fixed; z-index: 30; inset: 0; background: rgba(17, 24, 39, 0.48); }
            body.history-open #history-backdrop { display: block; }
            body.history-open { overflow: hidden; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <button id="history-backdrop" type="button" aria-label="Close history" onclick="closeHistoryDrawer()"></button>
        <aside id="history">
            <div class="history-heading">
                <h2>History</h2>
                <button id="history-close" type="button" aria-label="Close history" onclick="closeHistoryDrawer(true)">×</button>
            </div>
            <div class="history-tabs" role="group" aria-label="Filter history by media type">
                <button id="history-images" class="history-tab active" type="button" aria-pressed="true" onclick="setHistoryType('image')">Images</button>
                <button id="history-videos" class="history-tab" type="button" aria-pressed="false" onclick="setHistoryType('video')">Videos</button>
            </div>
            <div id="history-list"></div>
        </aside>
        <section id="content">
            <button id="history-toggle" type="button" aria-controls="history" aria-expanded="false" onclick="toggleHistoryDrawer()"><span aria-hidden="true">☰</span> History</button>
            <h1 id="mode-title">Generate image from prompt</h1>

            <div class="mode-toggle">
                <button id="mode-image" class="active" onclick="setMode('image')">🎨 Image</button>
                <button id="mode-video" onclick="setMode('video')">🎬 Video</button>
            </div>

            <div id="video-controls">
                <div class="video-mode-toggle" role="group" aria-label="Video generation engine">
                    <button id="video-engine-manim" class="active" type="button" aria-pressed="true" onclick="setVideoEngine('manim')">Manim</button>
                    <button id="video-engine-ai" type="button" aria-pressed="false" onclick="setVideoEngine('ai')">AI video</button>
                </div>
                <div id="ai-video-type" class="video-mode-toggle" role="group" aria-label="AI video mode">
                    <button id="ai-video-text" class="active" type="button" aria-pressed="true" onclick="setAiVideoMode('text')">Text to video</button>
                    <button id="ai-video-image-mode" type="button" aria-pressed="false" onclick="setAiVideoMode('image')">Image to video</button>
                </div>
                <div id="ai-video-image-source" class="ai-video-image-source">
                    <label class="image-setting" for="ai-video-source-type">Image source
                        <select id="ai-video-source-type" onchange="updateAiVideoControls()">
                            <option value="history">Generated image</option>
                            <option value="upload">Upload image</option>
                        </select>
                    </label>
                    <label id="ai-video-history-field" class="image-setting" for="ai-video-image">From history
                        <select id="ai-video-image"></select>
                    </label>
                    <label id="ai-video-upload-field" class="image-setting" for="ai-video-upload">Upload image
                        <input id="ai-video-upload" type="file" accept="image/png,image/jpeg,image/webp">
                    </label>
                </div>
            </div>

            <div class="prompt-row">
                <input type="text" id="prompt" placeholder="e.g. A circle flying into a star">
                <button id="generate-btn" onclick="generate()">Generate</button>
            </div>

            <div id="image-settings">
                <label class="image-setting" for="style-preset">Style
                    <select id="style-preset">
                        <option value="none">Default</option>
                        <option value="photorealistic">Photorealistic</option>
                        <option value="3d">3D render</option>
                        <option value="2d">2D illustration</option>
                        <option value="anime">Anime</option>
                        <option value="sketch">Sketch</option>
                        <option value="painting">Painting</option>
                    </select>
                </label>
                <label class="image-setting range-setting" for="image-quality">Quality <output id="quality-value" class="setting-value">30 steps</output>
                    <input id="image-quality" type="range" min="15" max="50" step="5" value="30">
                </label>
                <label class="image-setting range-setting" for="guidance-scale">Prompt adherence <output id="guidance-value" class="setting-value">5.0</output>
                    <input id="guidance-scale" type="range" min="2" max="10" step="0.5" value="5">
                </label>
            </div>

            <p id="error"></p>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p id="loading-text">Generating...</p>
                <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
                <p id="progress-text">0%</p>
            </div>

            <div id="viewer-shell">
                <div id="viewer-controls">
                    <div id="zoom-controls" aria-label="Image zoom controls">
                        <button id="zoom-out" type="button" onclick="zoomOut()" title="Zoom out" aria-label="Zoom out">-</button>
                        <output id="zoom-level" aria-live="polite">100%</output>
                        <button id="zoom-in" type="button" onclick="zoomIn()" title="Zoom in" aria-label="Zoom in">+</button>
                        <button id="zoom-reset" type="button" onclick="resetZoom()" title="Fit image" aria-label="Fit image">Fit</button>
                    </div>
                    <button id="fullscreen-toggle" type="button" onclick="toggleFullscreen()" title="Full screen" aria-label="Full screen">⛶</button>
                </div>
                <p id="viewer-prompt" aria-live="polite"></p>
                <div id="media-stage">
                    <div id="image-canvas">
                        <img id="generated-image" alt="Generated image">
                    </div>
                    <video id="animation" controls></video>
                </div>
            </div>
        </section>
    </div>

    <script src="/chatbot.js"></script>
</body>
</html>
